<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Три вида одного места</title>
  <desc id="description">Три схематические зарисовки с одной площадки: деревянный проём и неровная линия дальнего леса; деревянный проём и низкая поверхность воды у берегового склона; деревянный проём и фасад дома под двускатной крышей с дверью и окнами. Лесной край, вода и дом остаются частями одного места. Наброски показывают увиденные ориентиры, а не карту пути.</desc>

