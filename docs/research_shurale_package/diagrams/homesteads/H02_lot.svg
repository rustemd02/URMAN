<text x="45" y="50" font-size="27" font-weight="700">H02: участок, потоки людей, машины и воды</text>
<text x="45" y="84" font-size="15" font-weight="400">22 × 55 м. Ось X вдоль фронта, Y от улицы в глубину. Север не задан. Размеры — проектные.</text>
