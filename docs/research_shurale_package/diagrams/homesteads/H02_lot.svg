<line x1="282.75" y1="216" x2="298.04999999999995" y2="216" stroke="#3A8EA2" stroke-width="5"/>
<line x1="321" y1="276" x2="321" y2="292" stroke="#F7F5EF" stroke-width="5"/>
<text x="600" y="190" font-size="24" font-weight="700">Согласованность</text>
<text x="600" y="240" font-size="17" font-weight="400">Дом: x=3…13, y=3…11. Сени: x=13…16, y=5…9. Вход дома на восточной</text>
<text x="600" y="265" font-size="17" font-weight="400">стороне ведет в связующую зону H02.</text>
<text x="600" y="366" font-size="17" font-weight="400">Проезд: полоса x=17…22. Ворота 3,5 м в свету. Ее проектная ширина</text>
<text x="600" y="391" font-size="17" font-weight="400">5 м не является расстоянием между стеной дома и забором.</text>
<text x="600" y="492" font-size="17" font-weight="400">Человек проходит от отдельной калитки к сеням. Дальше сохраняется</text>
<text x="600" y="517" font-size="17" font-weight="400">пешеходный путь к бане, не через цветник и не через сарай.</text>
<text x="600" y="618" font-size="17" font-weight="400">Грузовая зона перед сараем остается открытой. Маневр конкретного</text>
<text x="600" y="643" font-size="17" font-weight="400">автомобиля проверяется после выбора его модели; радиус поворота</text>
<text x="600" y="668" font-size="17" font-weight="400">здесь не измерен.</text>
<text x="600" y="744" font-size="17" font-weight="400">Огород: y=32…52. Два метра до заднего ограждения оставлены как</text>
<text x="600" y="769" font-size="17" font-weight="400">рабочий запас, не нормативный отступ.</text>
<text x="600" y="870" font-size="17" font-weight="400">Вода направляется к выбранным понижениям и уличной канаве. Точные</text>
<text x="600" y="895" font-size="17" font-weight="400">отметки рельефа не заданы: схема не заменяет вертикальную</text>
<text x="600" y="920" font-size="17" font-weight="400">планировку.</text>
<text x="600" y="996" font-size="17" font-weight="400">Цвет не является этнографической палитрой. Зеленый обозначает</text>
<text x="600" y="1021" font-size="17" font-weight="400">посадки, серо-бежевый — рабочие покрытия, голубой — уличное</text>
<text x="600" y="1046" font-size="17" font-weight="400">водоотведение.</text>
<line x1="620" y1="1140" x2="680" y2="1140" stroke="#256B6A" stroke-width="5"/>
<text x="697" y="1147" font-size="17" font-weight="400">Машина / подвоз</text>
<line x1="620" y1="1180" x2="680" y2="1180" stroke="#D09D52" stroke-width="5"/>
<text x="697" y="1187" font-size="17" font-weight="400">Пешеходная связь</text>
<line x1="100" y1="1150" x2="270" y2="1150" stroke="#21333B" stroke-width="5"/>
<line x1="100" y1="1142" x2="100" y2="1158" stroke="#21333B" stroke-width="2"/>
<line x1="270" y1="1142" x2="270" y2="1158" stroke="#21333B" stroke-width="2"/>
<text x="100" y="1179" font-size="14" font-weight="400">0</text>
<text x="270" y="1179" font-size="14" font-weight="400" text-anchor="end">10 м</text><text x="45" y="1275" font-family="DejaVu Sans" font-size="13" fill="#65727A">SHURALE RESEARCH • Предложено для игры • Не обмер реального объекта</text></svg>