<text x="236" y="195.6" font-size="15" font-weight="400" text-anchor="middle">Палисадник</text>
<text x="236" y="267" font-size="20" font-weight="700" text-anchor="middle">ДОМ</text>
<text x="236" y="292.5" font-size="16" font-weight="400" text-anchor="middle">10 × 8 м</text>
<text x="346.5" y="284" font-size="14" font-weight="400" text-anchor="middle">Сени</text>
<text x="210.5" y="539" font-size="16" font-weight="400" text-anchor="middle">Сарай</text>
<text x="338" y="501.6" font-size="14" font-weight="400" text-anchor="middle">Дрова</text>
<text x="338" y="607" font-size="16" font-weight="400" text-anchor="middle">Баня</text>
<text x="287" y="896" font-size="19" font-weight="700" text-anchor="middle">ОГОРОД</text>
<line x1="389" y1="165" x2="448.5" y2="165" stroke="#256B6A" stroke-width="8"/>
<line x1="355" y1="165" x2="372" y2="165" stroke="#D09D52" stroke-width="8"/>
