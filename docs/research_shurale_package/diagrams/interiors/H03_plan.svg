<text x="100" y="755" font-size="17" font-weight="400">Наружный контур корпуса: 11 × 8 м. Сени: 2 × 3 м. Значения не равны чистовой площади.</text>
<text x="100" y="802" font-size="17" font-weight="400">Грязная входная зона не совпадает с гостевой комнатой. Сарай и кормовая зона вне теплого корпуса.</text>
