<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1060" viewBox="0 0 1500 1060">
<rect width="1500" height="1060" fill="#F7F5EF"/>
<style>text{font-family:DejaVu Sans,sans-serif;fill:#21333B}</style>
<text x="45" y="50" font-size="27" font-weight="700">Три уличных профиля: разложение ширины</text>
<text x="45" y="84" font-size="15" font-weight="400">План-полосы в метрах. Нулевой уровень высоты не задан. Все числа — проектные, без натурного обмера.</text>
<text x="50" y="135" font-size="23" font-weight="700">ST01 • основная жилая улица</text>
<rect x="100" y="169" width="264" height="90" fill="#D6DEC8" stroke="#54656B" stroke-width="2"/>
<text x="232.0" y="205" font-size="14" font-weight="400" text-anchor="middle">Зелень</text>
<text x="232.0" y="235" font-size="16" font-weight="700" text-anchor="middle">4</text>
<rect x="364" y="169" width="66" height="90" fill="#B7D0D3" stroke="#54656B" stroke-width="2"/>
<text x="397.0" y="205" font-size="14" font-weight="400" text-anchor="middle">Канава</text>
<text x="397.0" y="235" font-size="16" font-weight="700" text-anchor="middle">1</text>
<rect x="430" y="169" width="49.5" height="90" fill="#E0CDB0" stroke="#54656B" stroke-width="2"/>
<text x="454.75" y="205" font-size="14" font-weight="400" text-anchor="middle">Край</text>
<text x="454.75" y="235" font-size="16" font-weight="700" text-anchor="middle">0,75</text>
<rect x="479.5" y="169" width="297.0" height="90" fill="#B4BBC0" stroke="#54656B" stroke-width="2"/>
<text x="628.0" y="205" font-size="14" font-weight="400" text-anchor="middle">Дорога</text>
<text x="628.0" y="235" font-size="16" font-weight="700" text-anchor="middle">4,5</text>
<rect x="776.5" y="169" width="49.5" height="90" fill="#E0CDB0" stroke="#54656B" stroke-width="2"/>
<text x="801.25" y="205" font-size="14" font-weight="400" text-anchor="middle">Край</text>
<text x="801.25" y="235" font-size="16" font-weight="700" text-anchor="middle">0,75</text>
<rect x="826.0" y="169" width="66" height="90" fill="#B7D0D3" stroke="#54656B" stroke-width="2"/>
<text x="859.0" y="205" font-size="14" font-weight="400" text-anchor="middle">Канава</text>
<text x="859.0" y="235" font-size="16" font-weight="700" text-anchor="middle">1</text>
<rect x="892.0" y="169" width="264" height="90" fill="#D6DEC8" stroke="#54656B" stroke-width="2"/>
<text x="1024.0" y="205" font-size="14" font-weight="400" text-anchor="middle">Зелень</text>
<text x="1024.0" y="235" font-size="16" font-weight="700" text-anchor="middle">4</text>
<text x="100" y="292" font-size="17" font-weight="400">Между ограждениями: 16 м. Пешеходный след входит в зеленую полосу, а не прибавляется к ней.</text>
<text x="100" y="322" font-size="17" font-weight="400">Для ST01: 3 м палисадник + 16 м улица + 3 м палисадник = 22 м между фасадами.</text>
<text x="50" y="390" font-size="23" font-weight="700">ST02 • боковой проезд</text>
<rect x="100" y="424" width="198" height="90" fill="#D6DEC8" stroke="#54656B" stroke-width="2"/>
<text x="199.0" y="460" font-size="14" font-weight="400" text-anchor="middle">Зелень</text>
<text x="199.0" y="490" font-size="16" font-weight="700" text-anchor="middle">3</text>
<rect x="298" y="424" width="49.5" height="90" fill="#B7D0D3" stroke="#54656B" stroke-width="2"/>
<text x="322.75" y="460" font-size="14" font-weight="400" text-anchor="middle">Канава</text>
<text x="322.75" y="490" font-size="16" font-weight="700" text-anchor="middle">0,75</text>
<rect x="347.5" y="424" width="33.0" height="90" fill="#E0CDB0" stroke="#54656B" stroke-width="2"/>
<text x="364.0" y="460" font-size="14" font-weight="400" text-anchor="middle">Край</text>
<text x="364.0" y="490" font-size="16" font-weight="700" text-anchor="middle">0,5</text>
<rect x="380.5" y="424" width="231.0" height="90" fill="#B4BBC0" stroke="#54656B" stroke-width="2"/>
<text x="496.0" y="460" font-size="14" font-weight="400" text-anchor="middle">Дорога</text>
<text x="496.0" y="490" font-size="16" font-weight="700" text-anchor="middle">3,5</text>
<rect x="611.5" y="424" width="33.0" height="90" fill="#E0CDB0" stroke="#54656B" stroke-width="2"/>
<text x="628.0" y="460" font-size="14" font-weight="400" text-anchor="middle">Край</text>
<text x="628.0" y="490" font-size="16" font-weight="700" text-anchor="middle">0,5</text>
<rect x="644.5" y="424" width="49.5" height="90" fill="#B7D0D3" stroke="#54656B" stroke-width="2"/>
<text x="669.25" y="460" font-size="14" font-weight="400" text-anchor="middle">Канава</text>
<text x="669.25" y="490" font-size="16" font-weight="700" text-anchor="middle">0,75</text>
<rect x="694.0" y="424" width="198" height="90" fill="#D6DEC8" stroke="#54656B" stroke-width="2"/>
<text x="793.0" y="460" font-size="14" font-weight="400" text-anchor="middle">Зелень</text>
<text x="793.0" y="490" font-size="16" font-weight="700" text-anchor="middle">3</text>
<text x="100" y="547" font-size="17" font-weight="400">Между ограждениями: 12 м. Пешеходный след входит в зеленую полосу, а не прибавляется к ней.</text>
<text x="100" y="577" font-size="17" font-weight="400">Узкий участок не обязан иметь те же палисадники и фронт домов, что ST01.</text>
<text x="50" y="645" font-size="23" font-weight="700">ST03 • обновленный участок</text>
<rect x="100" y="679" width="247.5" height="90" fill="#D6DEC8" stroke="#54656B" stroke-width="2"/>
<text x="223.75" y="715" font-size="14" font-weight="400" text-anchor="middle">Зелень</text>
<text x="223.75" y="745" font-size="16" font-weight="700" text-anchor="middle">3,75</text>
<rect x="347.5" y="679" width="66" height="90" fill="#B7D0D3" stroke="#54656B" stroke-width="2"/>
<text x="380.5" y="715" font-size="14" font-weight="400" text-anchor="middle">Канава</text>
<text x="380.5" y="745" font-size="16" font-weight="700" text-anchor="middle">1</text>
