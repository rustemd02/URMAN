<text x="438.25" y="715" font-size="14" font-weight="400" text-anchor="middle">Край</text>
<text x="438.25" y="745" font-size="16" font-weight="700" text-anchor="middle">0,75</text>
<rect x="463.0" y="679" width="363.0" height="90" fill="#B4BBC0" stroke="#54656B" stroke-width="2"/>
<text x="644.5" y="715" font-size="14" font-weight="400" text-anchor="middle">Дорога</text>
<text x="644.5" y="745" font-size="16" font-weight="700" text-anchor="middle">5,5</text>
<rect x="826.0" y="679" width="49.5" height="90" fill="#E0CDB0" stroke="#54656B" stroke-width="2"/>
<text x="850.75" y="715" font-size="14" font-weight="400" text-anchor="middle">Край</text>
<text x="850.75" y="745" font-size="16" font-weight="700" text-anchor="middle">0,75</text>
<rect x="875.5" y="679" width="66" height="90" fill="#B7D0D3" stroke="#54656B" stroke-width="2"/>
<text x="908.5" y="715" font-size="14" font-weight="400" text-anchor="middle">Канава</text>
<text x="908.5" y="745" font-size="16" font-weight="700" text-anchor="middle">1</text>
<rect x="941.5" y="679" width="247.5" height="90" fill="#D6DEC8" stroke="#54656B" stroke-width="2"/>
<text x="1065.25" y="715" font-size="14" font-weight="400" text-anchor="middle">Зелень</text>
<text x="1065.25" y="745" font-size="16" font-weight="700" text-anchor="middle">3,75</text>
<text x="100" y="802" font-size="17" font-weight="400">Между ограждениями: 18 м. Пешеходный след входит в зеленую полосу, а не прибавляется к ней.</text>
<text x="100" y="832" font-size="17" font-weight="400">Пешеходная полоса 1,2 м включена в одну из зеленых полос 3,75 м.</text>
<line x1="100" y1="950" x2="430" y2="950" stroke="#21333B" stroke-width="5"/>
<line x1="100" y1="942" x2="100" y2="958" stroke="#21333B" stroke-width="2"/>
<line x1="430" y1="942" x2="430" y2="958" stroke="#21333B" stroke-width="2"/>
<text x="100" y="979" font-size="14" font-weight="400">0</text>
<text x="430" y="979" font-size="14" font-weight="400" text-anchor="end">5 м</text>
<text x="500" y="955" font-size="16" font-weight="400">Упрощение: можно сокращать длину улицы, не стирая канаву и переезд во двор.</text><text x="45" y="1035" font-family="DejaVu Sans" font-size="13" fill="#65727A">SHURALE RESEARCH • Предложено для игры • Не обмер реального объекта</text></svg>