<text x="160" y="235" font-size="20" font-weight="700">SC04 / SC10</text>
<text x="475" y="235" font-size="20" font-weight="700">Поле и тропа</text>
<text x="790" y="235" font-size="20" font-weight="700">SC11</text>
<text x="1110" y="235" font-size="20" font-weight="700">SC12</text>
<text x="120" y="330" font-size="17" font-weight="400">Задние границы</text>
<text x="120" y="360" font-size="17" font-weight="400">участков</text>
<text x="440" y="330" font-size="18" font-weight="400">120 м открытого промежутка</text>
<text x="785" y="330" font-size="18" font-weight="400">15 м</text>
<text x="1040" y="330" font-size="18" font-weight="400">180 м лесного модуля</text>
