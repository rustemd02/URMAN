<text x="535" y="595" font-size="17" font-weight="400">Вода — отдельное понижение</text>
<text x="80" y="655" font-size="17" font-weight="400">Допустимо сократить длинную дорогу между значимыми местами. Нельзя без последствий убрать открытую полосу: изменятся видимость, ветер, дальность</text>
<text x="80" y="680" font-size="17" font-weight="400">бытовых звуков и само отношение деревни к лесу. Числа не получены из спутникового измерения.</text><text x="45" y="755" font-family="DejaVu Sans" font-size="13" fill="#65727A">SHURALE RESEARCH • Предложено для игры • Не обмер реального объекта</text></svg>