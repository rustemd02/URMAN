<text x="45" y="50" font-size="27" font-weight="700">От двора к воде и лесу: что можно сжимать</text>
<text x="45" y="84" font-size="15" font-weight="400">Игровое предложение. Горизонтальные отрезки имеют проектные длины; вертикальный рельеф показан условно.</text>
