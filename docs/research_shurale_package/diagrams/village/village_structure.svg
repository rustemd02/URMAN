<text x="1020" y="70" font-size="20" font-weight="700">SC11–12 • отдельный лесной фрагмент</text>
<text x="740" y="940" font-size="17" font-weight="400">Вода ниже выбранной жилой террасы; русло и мостик не обмерены.</text>
<text x="80" y="900" font-size="17" font-weight="400">Не каждый населенный пункт обязан иметь школу, клуб, магазин и мечеть в одном узле.</text>
<text x="80" y="935" font-size="17" font-weight="400">Музейные здания Нового Кырлая не включены как обязательный центр вымышленной деревни.</text><text x="45" y="1025" font-family="DejaVu Sans" font-size="13" fill="#65727A">SHURALE RESEARCH • Предложено для игры • Не обмер реального объекта</text></svg>