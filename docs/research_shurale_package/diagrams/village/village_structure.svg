<text x="45" y="50" font-size="27" font-weight="700">Локальная модель деревни: связи и границы</text>
<text x="45" y="84" font-size="15" font-weight="400">Аналитическое игровое предложение, без масштаба. Верхняя Ия — географическая основа, не копия реального Кырлая.</text>
