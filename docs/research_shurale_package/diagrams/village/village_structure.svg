<text x="975" y="423" font-size="14" font-weight="400" text-anchor="middle">Магазин / узел</text>
<text x="70" y="450" font-size="20" font-weight="700">SC01 • въезд</text>
<text x="440" y="480" font-size="20" font-weight="700">SC02 • жилая улица</text>
<text x="360" y="290" font-size="20" font-weight="700">SC03–07 • хозяйства и внутренние пространства</text>
